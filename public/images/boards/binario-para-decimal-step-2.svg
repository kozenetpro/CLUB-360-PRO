<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Binário para decimal passo 2</title>
  <desc id="desc">Quadro visual para segundo passo da conversão 1011 base 2</desc>
  <rect width="1600" height="1000" fill="#fffdf7"/>
  <text x="120" y="155" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#0f172a">Step 2: escreva os pesos</text>
  <text x="300" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="100" fill="#2563eb">1    0    1    1</text>
  <text x="300" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="78" fill="#64748b">2³   2²   2¹   2⁰</text>
  <text x="300" y="735" font-family="Inter, Arial, sans-serif" font-size="44" fill="#334155">A direita começa em potência zero.</text>
</svg>
