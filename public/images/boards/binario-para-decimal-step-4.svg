<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Binário para decimal passo 4</title>
  <desc id="desc">Quadro visual para quarto passo da conversão 1011 base 2</desc>
  <rect width="1600" height="1000" fill="#fffdf7"/>
  <text x="120" y="155" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#0f172a">Step 4: some tudo</text>
  <text x="260" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="84" fill="#2563eb">8 + 0 + 2 + 1 = 11</text>
  <rect x="430" y="520" width="740" height="180" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="8"/>
  <text x="520" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="800" fill="#166534">1011₂ = 11₁₀</text>
</svg>
