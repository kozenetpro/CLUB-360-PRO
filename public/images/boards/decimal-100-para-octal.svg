<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Decimal 100 para octal</title>
  <desc id="desc">Quadro visual para conversão de 100 decimal para octal</desc>
  <rect width="1600" height="1000" fill="#fff7ed"/>
  <text x="120" y="150" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#0f172a">Decimal para octal</text>
  <text x="260" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="62" fill="#0f172a">100 ÷ 8 = 12 resto 4</text>
  <text x="260" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="62" fill="#0f172a">12 ÷ 8 = 1 resto 4</text>
  <text x="260" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="62" fill="#0f172a">1 ÷ 8 = 0 resto 1</text>
  <text x="410" y="780" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="82" font-weight="800" fill="#16a34a">100₁₀ = 144₈</text>
</svg>
