<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Decimal para binário passo 3</title>
  <desc id="desc">Quadro visual para restos circulados</desc>
  <rect width="1600" height="1000" fill="#fffdf7"/>
  <text x="120" y="155" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#0f172a">Step 3: guarde os restos</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="84" font-weight="800" text-anchor="middle"><circle cx="390" cy="450" r="80" fill="#dbeafe" stroke="#2563eb" stroke-width="8"/><text x="390" y="480" fill="#2563eb">1</text><circle cx="640" cy="450" r="80" fill="#dbeafe" stroke="#2563eb" stroke-width="8"/><text x="640" y="480" fill="#2563eb">0</text><circle cx="890" cy="450" r="80" fill="#dbeafe" stroke="#2563eb" stroke-width="8"/><text x="890" y="480" fill="#2563eb">1</text><circle cx="1140" cy="450" r="80" fill="#dbeafe" stroke="#2563eb" stroke-width="8"/><text x="1140" y="480" fill="#2563eb">1</text></g>
  <text x="340" y="700" font-family="Inter, Arial, sans-serif" font-size="48" fill="#334155">Os restos vão formar o novo número.</text>
</svg>
