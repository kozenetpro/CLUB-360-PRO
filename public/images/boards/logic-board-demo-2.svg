  <text x="742" y="508" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="40">Ask:</text>
  <text x="742" y="576" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="38">What condition are we checking?</text>
