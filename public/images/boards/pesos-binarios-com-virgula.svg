<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pesos binarios com virgula</title>
  <desc id="desc">Board provisoria mostrando pesos positivos antes da virgula e negativos depois da virgula.</desc>
  <rect width="1600" height="1000" fill="#fffbeb"/>
  <rect x="90" y="80" width="1420" height="840" rx="34" fill="#fffefa" stroke="#111827" stroke-width="6"/>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Pesos antes e depois da virgula</text>
  <text x="360" y="350" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#2563eb">1</text>
  <text x="540" y="350" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#2563eb">0</text>
  <text x="705" y="350" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#111827">,</text>
  <text x="820" y="350" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#16a34a">1</text>
  <text x="1010" y="350" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#16a34a">0</text>
  <text x="1200" y="350" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#16a34a">1</text>
  <text x="330" y="465" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1e3a8a">2^1</text>
  <text x="515" y="465" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1e3a8a">2^0</text>
  <text x="780" y="465" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#166534">2^-1</text>
  <text x="970" y="465" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#166534">2^-2</text>
  <text x="1160" y="465" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#166534">2^-3</text>
  <rect x="250" y="610" width="470" height="145" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="295" y="670" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1e3a8a">Antes da virgula</text>
  <text x="295" y="720" font-family="Arial, sans-serif" font-size="30" fill="#1e40af">pesos crescem</text>
  <rect x="880" y="610" width="470" height="145" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="925" y="670" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#14532d">Depois da virgula</text>
  <text x="925" y="720" font-family="Arial, sans-serif" font-size="30" fill="#166534">pesos diminuem</text>
</svg>
