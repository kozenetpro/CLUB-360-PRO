<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Q2 step 2 parte inteira</title>
  <desc id="desc">Board provisoria calculando a parte inteira 10 em base 2.</desc>
  <rect width="1600" height="1000" fill="#eff6ff"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#1e3a8a" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Q2 Step 2: parte inteira</text>
  <text x="530" y="330" font-family="Arial, sans-serif" font-size="92" font-weight="800" fill="#2563eb">1   0</text>
  <text x="520" y="450" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#1e40af">2^1   2^0</text>
  <rect x="310" y="585" width="980" height="165" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="390" y="655" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">1 x 2 + 0 x 1 = 2</text>
  <text x="600" y="715" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#1d4ed8">10₂ = 2₁₀</text>
</svg>
