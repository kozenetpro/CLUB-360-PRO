<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Q2 step 3 parte fracionaria</title>
  <desc id="desc">Board provisoria calculando a parte fracionaria 101 em base 2.</desc>
  <rect width="1600" height="1000" fill="#f0fdf4"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#166534" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Q2 Step 3: parte depois da virgula</text>
  <text x="500" y="320" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#16a34a">1    0    1</text>
  <text x="450" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#166534">2^-1   2^-2   2^-3</text>
  <rect x="275" y="570" width="1050" height="210" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="335" y="650" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#14532d">1 x 0,5 + 0 x 0,25 + 1 x 0,125</text>
  <text x="585" y="720" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#15803d">= 0,625</text>
</svg>
