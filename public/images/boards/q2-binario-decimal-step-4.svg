<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Q2 step 4 resposta</title>
  <desc id="desc">Board provisoria mostrando a resposta 10,101 base 2 igual a 2,6250 base 10.</desc>
  <rect width="1600" height="1000" fill="#fff7ed"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#ea580c" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Q2 Step 4: juntar tudo</text>
  <rect x="280" y="280" width="1040" height="170" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="5"/>
  <text x="390" y="385" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#9a3412">2 + 0,625 = 2,625</text>
  <rect x="300" y="560" width="1000" height="175" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="455" y="668" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#14532d">10,101₂ = 2,6250₁₀</text>
</svg>
