<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Q3 step 2 converter 7</title>
  <desc id="desc">Board provisoria convertendo 7 decimal para 111 em binario.</desc>
  <rect width="1600" height="1000" fill="#eff6ff"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#1e40af" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Q3 Step 2: parte inteira</text>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1e3a8a">7 / 2 = 3 resto 1</text>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1e3a8a">3 / 2 = 1 resto 1</text>
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1e3a8a">1 / 2 = 0 resto 1</text>
  <path d="M930 470V315" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <path d="M930 315l-30 45M930 315l30 45" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <rect x="430" y="640" width="740" height="130" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="620" y="720" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#1d4ed8">7₁₀ = 111₂</text>
</svg>
