<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Q3 step 3 multiplicar parte decimal</title>
  <desc id="desc">Board provisoria convertendo 0,32 para binario por multiplicacao por 2.</desc>
  <rect width="1600" height="1000" fill="#f0fdf4"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#166534" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Q3 Step 3: parte decimal</text>
  <text x="340" y="300" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#14532d">0,32 x 2 = 0,64  pega 0</text>
  <text x="340" y="380" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#14532d">0,64 x 2 = 1,28  pega 1</text>
  <text x="340" y="460" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#14532d">0,28 x 2 = 0,56  pega 0</text>
  <text x="340" y="540" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#14532d">0,56 x 2 = 1,12  pega 1</text>
  <rect x="520" y="680" width="560" height="120" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="640" y="755" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#15803d">bits: 0101</text>
</svg>
