<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Multiplicacao binaria por deslocamento</title>
  <desc id="desc">Board provisoria mostrando 100101 multiplicado por 100 em binario.</desc>
  <rect width="1600" height="1000" fill="#eff6ff"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#1e40af" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Multiplicar por 100₂</text>
  <text x="455" y="340" font-family="Arial, sans-serif" font-size="80" font-weight="800" fill="#2563eb">100101₂</text>
  <text x="360" y="455" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#1e3a8a">desloca duas casas para a esquerda</text>
  <path d="M515 535H1060" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
  <path d="M1060 535l-45 -35M1060 535l-45 35" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
  <rect x="360" y="640" width="880" height="135" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="565" y="725" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#1d4ed8">10010100₂</text>
</svg>
