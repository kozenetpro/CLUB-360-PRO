<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Divisao binaria com duas casas</title>
  <desc id="desc">Board provisoria mostrando divisao binaria aproximada com duas casas.</desc>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#111827" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Divisao binaria com 2 casas</text>
  <rect x="245" y="260" width="1110" height="160" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="375" y="330" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">100101₂ = 37₁₀</text>
  <text x="375" y="385" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">1011₂ = 11₁₀</text>
  <text x="420" y="545" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#111827">37 / 11 = 3,36...</text>
  <rect x="360" y="650" width="880" height="140" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="590" y="737" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#14532d">≈ 11,01₂</text>
</svg>
