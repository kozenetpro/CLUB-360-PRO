<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Operacoes em hexadecimal</title>
  <desc id="desc">Board provisoria mostrando soma e subtracao em hexadecimal.</desc>
  <rect width="1600" height="1000" fill="#fff7ed"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#9a3412" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Operacoes em hexadecimal</text>
  <rect x="190" y="270" width="560" height="310" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="5"/>
  <text x="260" y="345" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#7c2d12">DE2 + 032</text>
  <text x="260" y="435" font-family="Arial, sans-serif" font-size="42" fill="#9a3412">E + 3 = 17</text>
  <text x="300" y="520" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#9a3412">= E14₁₆</text>
  <rect x="850" y="270" width="560" height="310" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="925" y="345" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#1e3a8a">10 - A</text>
  <text x="925" y="435" font-family="Arial, sans-serif" font-size="42" fill="#1e40af">16 - 10 = 6</text>
  <text x="980" y="520" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#1d4ed8">= 6₁₆</text>
  <text x="380" y="735" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#111827">A=10  B=11  C=12  D=13  E=14  F=15</text>
</svg>
