<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Operacoes em octal</title>
  <desc id="desc">Board provisoria mostrando soma e subtracao em octal.</desc>
  <rect width="1600" height="1000" fill="#f0fdf4"/>
  <rect x="100" y="90" width="1400" height="820" rx="32" fill="#ffffff" stroke="#166534" stroke-width="6"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Operacoes em octal</text>
  <rect x="190" y="270" width="560" height="320" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="260" y="345" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#14532d">705 + 123</text>
  <text x="260" y="420" font-family="Arial, sans-serif" font-size="38" fill="#166534">5 + 3 = 8</text>
  <text x="260" y="475" font-family="Arial, sans-serif" font-size="38" fill="#166534">vira 10₈</text>
  <text x="300" y="545" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#15803d">= 1030₈</text>
  <rect x="850" y="270" width="560" height="320" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/>
  <text x="925" y="345" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#78350f">65 - 47</text>
  <text x="925" y="430" font-family="Arial, sans-serif" font-size="42" fill="#92400e">empresta 1 casa = +8</text>
  <text x="1000" y="520" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#b45309">= 16₈</text>
  <text x="430" y="745" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#111827">No octal, depois do 7 vem 10.</text>
</svg>
