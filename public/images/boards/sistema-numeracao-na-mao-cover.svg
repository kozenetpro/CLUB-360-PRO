<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visao geral do sistema de numeracao</title>
  <desc id="desc">Quadro visual mostrando o caminho base, peso, conta e resposta para conversao de bases.</desc>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="90" y="76" width="1420" height="848" rx="34" fill="#fffdf7" stroke="#111827" stroke-width="7"/>

  <text x="150" y="160" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#111827">Sistema de numeracao na mao</text>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">A mesma ideia para binario, octal e hexadecimal</text>

  <rect x="150" y="290" width="1300" height="150" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="220" y="383" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">Base</text>
  <text x="460" y="383" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">Peso</text>
  <text x="710" y="383" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">Conta</text>
  <text x="995" y="383" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">Resposta</text>
  <path d="M380 365h55M620 365h55M865 365h80" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M435 365l-24 -18M435 365l-24 18M675 365l-24 -18M675 365l-24 18M945 365l-24 -18M945 365l-24 18" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <rect x="150" y="510" width="380" height="230" rx="24" fill="#ecfdf5" stroke="#16a34a" stroke-width="5"/>
    <text x="195" y="575" font-size="32" font-weight="800" fill="#14532d">Exemplo 1</text>
    <text x="195" y="645" font-size="48" font-weight="800" fill="#15803d">1011₂</text>
    <text x="195" y="700" font-size="32" fill="#166534">1x8 + 0x4 + 1x2 + 1</text>

    <rect x="610" y="510" width="380" height="230" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="5"/>
    <text x="655" y="575" font-size="32" font-weight="800" fill="#7c2d12">Exemplo 2</text>
    <text x="655" y="645" font-size="48" font-weight="800" fill="#c2410c">347₈</text>
    <text x="655" y="700" font-size="32" fill="#9a3412">3x64 + 4x8 + 7</text>

    <rect x="1070" y="510" width="380" height="230" rx="24" fill="#fef2f2" stroke="#dc2626" stroke-width="5"/>
    <text x="1115" y="575" font-size="32" font-weight="800" fill="#7f1d1d">Exemplo 3</text>
    <text x="1115" y="645" font-size="48" font-weight="800" fill="#b91c1c">2A₁₆</text>
    <text x="1115" y="700" font-size="32" fill="#991b1b">2x16 + 10</text>
  </g>

  <rect x="250" y="805" width="1100" height="78" rx="22" fill="#111827"/>
  <text x="320" y="855" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#ffffff">Cada posicao tem um peso. A base decide esse peso.</text>
</svg>
