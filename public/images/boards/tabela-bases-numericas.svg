<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tabela das bases numericas</title>
  <desc id="desc">Tabela visual comparando decimal, binario, octal e hexadecimal.</desc>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="90" y="80" width="1420" height="840" rx="34" fill="#fffdf7" stroke="#111827" stroke-width="7"/>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">Tabela das bases numericas</text>
  <text x="150" y="222" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">A base mostra quais simbolos podem aparecer em cada sistema.</text>

  <g font-family="Arial, sans-serif">
    <rect x="135" y="315" width="300" height="430" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
    <text x="180" y="390" font-size="40" font-weight="800" fill="#1e3a8a">Decimal</text>
    <text x="180" y="475" font-size="34" font-weight="800" fill="#2563eb">Base 10</text>
    <text x="180" y="555" font-size="32" fill="#1e40af">Simbolos:</text>
    <text x="180" y="615" font-size="36" font-weight="800" fill="#111827">0 ate 9</text>

    <rect x="475" y="315" width="300" height="430" rx="26" fill="#ecfdf5" stroke="#16a34a" stroke-width="5"/>
    <text x="520" y="390" font-size="40" font-weight="800" fill="#14532d">Binario</text>
    <text x="520" y="475" font-size="34" font-weight="800" fill="#16a34a">Base 2</text>
    <text x="520" y="555" font-size="32" fill="#166534">Simbolos:</text>
    <text x="520" y="615" font-size="36" font-weight="800" fill="#111827">0 e 1</text>

    <rect x="815" y="315" width="300" height="430" rx="26" fill="#fff7ed" stroke="#f97316" stroke-width="5"/>
    <text x="860" y="390" font-size="40" font-weight="800" fill="#7c2d12">Octal</text>
    <text x="860" y="475" font-size="34" font-weight="800" fill="#ea580c">Base 8</text>
    <text x="860" y="555" font-size="32" fill="#9a3412">Simbolos:</text>
    <text x="860" y="615" font-size="36" font-weight="800" fill="#111827">0 ate 7</text>

    <rect x="1155" y="315" width="300" height="430" rx="26" fill="#fef2f2" stroke="#dc2626" stroke-width="5"/>
    <text x="1190" y="390" font-size="36" font-weight="800" fill="#7f1d1d">Hexadecimal</text>
    <text x="1190" y="475" font-size="34" font-weight="800" fill="#dc2626">Base 16</text>
    <text x="1190" y="555" font-size="32" fill="#991b1b">Simbolos:</text>
    <text x="1190" y="615" font-size="34" font-weight="800" fill="#111827">0-9 e A-F</text>
  </g>

  <rect x="245" y="805" width="1110" height="80" rx="22" fill="#111827"/>
  <text x="310" y="858" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Quando chega no limite da base, vira a proxima casa.</text>
</svg>
